<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>رادار — غير متصل</title><style>body{font-family:Tahoma;background:#f5f7f9;color:#173944;max-width:700px;margin:10vh auto;padding:25px;line-height:1.9}a{color:#16715b}.row{background:white;padding:12px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between}small{color:#7b8f99}</style><h1>أنت غير متصل الآن.</h1><p>آخر لقطة محفوظة على هذا الجهاز للقراءة فقط. البيانات قديمة ولا يمكن إجراء فحص جديد دون اتصال.</p><small id="date"></small><div id="rows"></div><a href="/">إعادة الاتصال</a> · <button id="clear">مسح بيانات هذا الجهاز</button><script>
const req=indexedDB.open('radar-offline',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const db=req.result,t=db.transaction('snapshots'),r=t.objectStore('snapshots').get('latest');r.onsuccess=()=>{const d=r.result;if(!d)return;document.getElementById('date').textContent='آخر حفظ: '+d.savedAt;for(const s of d.snapshots){const row=document.createElement('div');row.className='row';const n=document.createElement('b');n.textContent=s.symbol+' — '+s.name;const p=document.createElement('span');p.textContent=s.price==null?'—':'$'+s.price.toFixed(2);row.append(n,p);document.getElementById('rows').append(row)}};document.getElementById('clear').onclick=()=>{const t=db.transaction('snapshots','readwrite');t.objectStore('snapshots').delete('latest');t.oncomplete=()=>{document.getElementById('rows').replaceChildren();document.getElementById('date').textContent='تم المسح'}}};
</script></html>
